<!-- Frontend/Proposals/editar_perfil.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Perfil - CleanYa</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css"/>

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/editar_perfil.css">
</head>
<body>
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div>
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a class="nav-link" onclick="navigateTo('../index.html')">
            <i class="bi bi-calendar"></i> Dashboard
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" onclick="navigateTo('../agenda.html')">
            <i class="bi bi-calendar"></i> Agenda
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" onclick="navigateTo('../pagos.html')">
            <i class="bi bi-cash-stack"></i> Pagos
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" onclick="navigateTo('../calificar-limpiador.html')">
            <i class="bi bi-check-circle"></i> Calificar Servicios
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" onclick="navigateTo('../verificar.html')">
            <i class="bi bi-person-check-fill"></i> Verificar Limpiadores
          </a>
        </li>
      </ul>
    </div>
    <div class="login-button mt-auto" onclick="navigateTo('../registro-inicio.html')">
      Iniciar Sesión
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <!-- Header -->
    <div class="header-brand">
      <div>
        <img src="../images/LOGO FINAL 2.png" alt="CleanYa" class="logo">
      </div>
      <!-- Botones de notificaciones y perfil -->
      <div class="user-info">
        <i class="bi bi-bell" onclick="mostrarNotificaciones()" style="cursor: pointer;">
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </i>
        <img src="../images/image 2.png" alt="Usuario" onclick="mostrarPerfil()" style="cursor: pointer;">
        <div class="text-end">
          <small>Administrador</small><br>
        </div>
      </div>
    </div>

    <!-- Contenido de la página -->
    <div class="container mt-4">
      <div class="row">
        <div class="col-md-4">
          <!-- Tarjeta de foto de perfil -->
          <div class="card profile-card">
            <div class="card-body text-center">
              <h5 class="card-title">Foto de Perfil</h5>
              <div class="profile-image-container">
                <img src="../images/image 2.png" alt="Foto de perfil" id="profile-image" class="profile-image">
                
              </div>
              <input type="file" id="profile-image-upload" class="d-none" accept="image/*">
              <button class="btn btn-primary mt-3" id="change-photo-btn">Cambiar Foto</button>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <!-- Formulario de edición de datos -->
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Editar Información Personal</h5>
            </div>
            <div class="card-body">
              <form id="profile-form">
                <div class="mb-3">
                  <label for="edit_name" class="form-label">Nombre Completo</label>
                  <input type="text" class="form-control" id="edit_name">
                </div>
                <div class="mb-3">
                  <label for="edit_email" class="form-label">Correo Electrónico</label>
                  <input type="email" class="form-control" id="edit_email">
                </div>
                <div class="mb-3">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input type="tel" class="form-control" id="telefono">
                </div>
                <div class="mb-3">
                  <label for="rol" class="form-label">Rol</label>
                  <input type="text" class="form-control" id="rol" value="Administrador" disabled>
                  <small class="text-muted">El rol no puede ser modificado</small>
                </div>
                <div class="mb-3">
                  <label for="edit_password" class="form-label">Nueva Contraseña</label>
                  <input type="password" class="form-control" id="edit_password" placeholder="Dejar en blanco para mantener la actual">
                </div>
                <div class="mb-3">
                  <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                  <input type="password" class="form-control" id="confirm-password">
                </div>
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
